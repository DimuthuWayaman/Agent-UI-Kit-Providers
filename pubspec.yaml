name: agent_ui_kit_providers
description: >-
  Themeable Flutter widgets for AI chat: streaming markdown bubbles,
  tool-call cards, a composer, and optional OpenRouter/Gemini providers.
version: 1.1.0
repository: https://github.com/DimuthuWayaman/Agent-UI-Kit-Providers
issue_tracker: https://github.com/DimuthuWayaman/Agent-UI-Kit-Providers/issues
homepage: https://github.com/DimuthuWayaman/Agent-UI-Kit-Providers
documentation: https://github.com/DimuthuWayaman/Agent-UI-Kit-Providers#readme

topics:
  - ai
  - chat
  - llm
  - openrouter
  - gemini

screenshots:
  - description: 'Streaming markdown chat bubble with tool calls and citations'
    path: screenshots/can_you_write_some_code_for_me.jpeg
  - description: 'Tool-call visualization states'
    path: screenshots/tool_calls.jpeg
  - description: 'Full markdown rendering: tables, code, task lists, blockquotes'
    path: screenshots/markdown.jpeg
  - description: 'Bubble types, grouping and thinking/streaming state'
    path: screenshots/grouping_and_thinking_state.jpeg

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

# The UI layer (widgets/, theme/, markdown/, controllers/, models/) has no
# dependency of its own. `http` is listed here only for the optional provider
# integrations under lib/src/providers/ (see lib/providers.dart) -- Dart/pub
# has no notion of an optional dependency, so it is resolved for every
# consumer regardless of which library entry point they import.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
